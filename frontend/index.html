<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reappraise — ReStore Pricing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #eef1f5;
      --surface:      #ffffff;
      --surface-2:    #f7f9fb;
      --primary:      #1a4f72;
      --primary-dark: #133a54;
      --primary-tint: #e8f1f8;
      --price:        #15643a;
      --price-tint:   #edf7f1;
      --border:       #d4dce6;
      --text:         #151e27;
      --text-2:       #5a6a7a;
      --error:        #b91c1c;
      --error-bg:     #fef2f2;
      --error-border: #fca5a5;
      --warn:         #92400e;
      --warn-bg:      #fffbeb;
      --warn-border:  #fcd34d;
      --radius-sm:    8px;
      --radius:       12px;
      --radius-lg:    16px;
      --shadow:       0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
      --shadow-sm:    0 1px 2px rgba(0,0,0,.06);
      --space:        16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 14px var(--space);
      padding-top: calc(14px + env(safe-area-inset-top));
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    header h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    header span {
      font-size: 0.75rem;
      opacity: 0.6;
      font-weight: 400;
    }

    /* ── Main layout ─────────────────────────────────── */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: var(--space);
      padding-bottom: calc(var(--space) * 2 + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Cards ───────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: var(--space);
    }

    .card-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 11px;
    }

    /* ── Photo section ───────────────────────────────── */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-photo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 18px 10px;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      transition: background 0.12s, border-color 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-photo:hover { background: var(--primary-tint); border-color: var(--primary); }
    .btn-photo:active { background: #d6e8f5; }

    .btn-photo:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .btn-photo svg {
      width: 22px;
      height: 22px;
      stroke: var(--primary);
      flex-shrink: 0;
    }

    /* Hidden file inputs */
    #input-camera,
    #input-gallery { display: none; }

    /* Photo preview */
    #preview-wrap {
      display: none;
      margin-top: 10px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      position: relative;
      background: #000;
    }

    #preview-wrap.visible { display: block; }

    #preview-img {
      display: block;
      width: 100%;
      max-height: 200px;
      object-fit: cover;
    }

    #preview-clear {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,.5);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Condition chips ─────────────────────────────── */
    .chips {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .chips input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .chips label {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      padding: 8px 5px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: border-color 0.1s, background 0.1s, color 0.1s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .chips input[type="radio"]:checked + label {
      border-color: var(--primary);
      background: var(--primary-tint);
      color: var(--primary);
      font-weight: 700;
    }

    .chips input[type="radio"]:focus-visible + label {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ── Description input ───────────────────────────── */
    label.card-title { display: block; }

    #input-description {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 1rem; /* 16px+ stops iOS zooming into the field */
      color: var(--text);
      background: var(--surface);
    }

    #input-description::placeholder { color: var(--text-2); opacity: 0.8; }

    #input-description:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
      border-color: var(--primary);
    }

    /* ── Submit button ───────────────────────────────── */
    #btn-submit {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(26,79,114,.3);
      transition: background 0.12s, box-shadow 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    #btn-submit:not(:disabled):hover {
      background: #1e5c85;
      box-shadow: 0 3px 12px rgba(26,79,114,.35);
    }

    #btn-submit:not(:disabled):active { background: var(--primary-dark); }

    #btn-submit:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      box-shadow: none;
    }

    #btn-submit:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    /* ── Loading ─────────────────────────────────────── */
    #loading {
      display: none;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px var(--space);
      box-shadow: var(--shadow-sm);
    }

    #loading.visible { display: flex; }

    .spinner {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      font-size: 0.85rem;
      color: var(--text-2);
    }

    /* ── Error ───────────────────────────────────────── */
    #error-box {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius);
      padding: var(--space);
    }

    #error-box.visible { display: block; }

    #error-box strong {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--error);
      margin-bottom: 3px;
    }

    #error-msg {
      font-size: 0.82rem;
      color: var(--error);
      line-height: 1.4;
    }

    /* ── Results ─────────────────────────────────────── */
    #results {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    #results.visible { display: flex; }

    /* Price hero card */
    .card-price {
      background: var(--price-tint);
      border-color: #b7dfca;
    }

    .res-item-name {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--price);
      margin-bottom: 6px;
    }

    .res-price-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #2e7d55;
      margin-bottom: 4px;
    }

    .res-price-value {
      font-size: 3.4rem;
      font-weight: 800;
      color: var(--price);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .res-price-note {
      margin-top: 7px;
      font-size: 0.78rem;
      color: #2e7d55;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Mock badge */
    .badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .badge-estimated {
      background: var(--warn-bg);
      color: var(--warn);
      border: 1px solid var(--warn-border);
    }

    /* Detail rows */
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .detail-row:first-child { padding-top: 0; }
    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }

    .detail-label {
      font-size: 0.83rem;
      color: var(--text-2);
      flex-shrink: 0;
    }

    .detail-value {
      font-size: 0.88rem;
      font-weight: 600;
      text-align: right;
    }

    /* Reset button */
    #btn-reset {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
      -webkit-tap-highlight-color: transparent;
    }

    #btn-reset:hover { background: var(--primary-tint); }
    #btn-reset:active { background: #d6e8f5; }

    #btn-reset:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ── History ─────────────────────────────────────── */
    #history { display: none; }
    #history.visible { display: block; }
    #history-title { margin-top: 0; }

    .history-meta {
      display: block;
      font-size: 0.72rem;
      margin-top: 2px;
    }

    /* ── Utility ─────────────────────────────────────── */
    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>Reappraise</h1>
    <span>ReStore pricing assistant</span>
  </div>
</header>

<main>

  <!-- ── Photo ──────────────────────────────── -->
  <div class="card">
    <div class="card-title">Photo</div>
    <div class="photo-grid">
      <button class="btn-photo" id="btn-camera" type="button" aria-label="Take a photo with camera">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Take Photo
      </button>
      <button class="btn-photo" id="btn-gallery" type="button" aria-label="Upload a photo from your gallery">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        From Gallery
      </button>
    </div>

    <input type="file" id="input-camera"  accept="image/*" capture="environment">
    <input type="file" id="input-gallery" accept="image/*">

    <div id="preview-wrap" aria-live="polite">
      <img id="preview-img" alt="Selected item photo">
      <button id="preview-clear" type="button" aria-label="Remove photo">✕</button>
    </div>
  </div>

  <!-- ── Condition ──────────────────────────── -->
  <div class="card">
    <div class="card-title" id="condition-label">Condition</div>
    <div class="chips" role="radiogroup" aria-labelledby="condition-label">
      <input type="radio" id="cond-terrible" name="condition" value="terrible">
      <label for="cond-terrible">Terrible</label>

      <input type="radio" id="cond-poor" name="condition" value="poor">
      <label for="cond-poor">Poor</label>

      <input type="radio" id="cond-fair" name="condition" value="fair" checked>
      <label for="cond-fair">Fair</label>

      <input type="radio" id="cond-good" name="condition" value="good">
      <label for="cond-good">Good</label>

      <input type="radio" id="cond-likenew" name="condition" value="like_new">
      <label for="cond-likenew">Like New</label>
    </div>
  </div>

  <!-- ── Description (optional) ─────────────── -->
  <div class="card">
    <label class="card-title" for="input-description">Know more about this item? (optional)</label>
    <input type="text" id="input-description" name="user_description"
           maxlength="255" autocomplete="off"
           placeholder="e.g. Trek Émonda SL 5, KitchenAid stand mixer">
  </div>

  <!-- ── Submit ─────────────────────────────── -->
  <button type="button" id="btn-submit" disabled>Price This Item</button>

  <!-- ── Loading ────────────────────────────── -->
  <div id="loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Searching eBay listings…</p>
  </div>

  <!-- ── Error ──────────────────────────────── -->
  <div id="error-box" role="alert">
    <strong>Unable to get a price estimate</strong>
    <span id="error-msg"></span>
  </div>

  <!-- ── Results ────────────────────────────── -->
  <div id="results" aria-live="polite">

    <div class="card card-price">
      <div class="res-item-name" id="res-item"></div>
      <div class="res-price-label">Estimated Resale Value</div>
      <div class="res-price-value" id="res-price"></div>
      <div class="res-price-note" id="res-price-note"></div>
    </div>

    <div class="card">
      <div class="detail-row">
        <span class="detail-label">Market median</span>
        <span class="detail-value" id="res-median"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Condition</span>
        <span class="detail-value" id="res-condition"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Price range</span>
        <span class="detail-value" id="res-range"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Sample size</span>
        <span class="detail-value" id="res-sample"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Searched eBay for
          <span class="history-meta" id="res-search-note"></span>
        </span>
        <span class="detail-value" id="res-search"></span>
      </div>
    </div>

    <button type="button" id="btn-reset">Price Another Item</button>

  </div>

  <!-- ── History (GET /history) ─────────────── -->
  <section class="card" id="history" aria-labelledby="history-title">
    <h2 class="card-title" id="history-title">Recent Appraisals</h2>
    <div id="history-list"></div>
  </section>

</main>

<script>
  'use strict';

  // ── DOM refs ──────────────────────────────────────────────────
  const btnCamera    = document.getElementById('btn-camera');
  const btnGallery   = document.getElementById('btn-gallery');
  const inputCamera  = document.getElementById('input-camera');
  const inputGallery = document.getElementById('input-gallery');
  const previewWrap  = document.getElementById('preview-wrap');
  const previewImg   = document.getElementById('preview-img');
  const previewClear = document.getElementById('preview-clear');
  const btnSubmit    = document.getElementById('btn-submit');
  const loading      = document.getElementById('loading');
  const errorBox     = document.getElementById('error-box');
  const errorMsg     = document.getElementById('error-msg');
  const results      = document.getElementById('results');
  const inputDescription = document.getElementById('input-description');

  // ── State ─────────────────────────────────────────────────────
  let selectedFile    = null;
  let previewObjectURL = null;

  // ── Photo selection ───────────────────────────────────────────
  btnCamera.addEventListener('click',  () => inputCamera.click());
  btnGallery.addEventListener('click', () => inputGallery.click());

  inputCamera.addEventListener('change',  e => applyFile(e.target.files[0]));
  inputGallery.addEventListener('change', e => applyFile(e.target.files[0]));

  function applyFile(file) {
    if (!file) return;
    if (previewObjectURL) URL.revokeObjectURL(previewObjectURL);
    previewObjectURL = URL.createObjectURL(file);
    selectedFile = file;
    previewImg.src = previewObjectURL;
    previewWrap.classList.add('visible');
    btnSubmit.disabled = false;
    hide(results);
    hide(errorBox);
  }

  previewClear.addEventListener('click', clearPhoto);

  function clearPhoto() {
    selectedFile = null;
    if (previewObjectURL) { URL.revokeObjectURL(previewObjectURL); previewObjectURL = null; }
    previewImg.src = '';
    previewWrap.classList.remove('visible');
    inputCamera.value = '';
    inputGallery.value = '';
    btnSubmit.disabled = true;
  }

  // ── Condition ─────────────────────────────────────────────────
  function getCondition() {
    return document.querySelector('input[name="condition"]:checked').value;
  }

  // ── Submit ────────────────────────────────────────────────────
  btnSubmit.addEventListener('click', async () => {
    if (!selectedFile) return;

    const condition = getCondition();
    const body = new FormData();
    body.append('file', selectedFile);
    const description = inputDescription.value.trim();
    if (description) body.append('user_description', description);

    show(loading);
    hide(errorBox);
    hide(results);
    btnSubmit.disabled = true;

    try {
      const resp = await fetch(`/appraise?condition=${encodeURIComponent(condition)}`, {
        method: 'POST',
        body,
      });

      let data = null;
      try { data = await resp.json(); } catch (_) { /* unparseable body */ }

      if (!resp.ok) {
        const detail = data?.detail;
        const msg = typeof detail === 'string'
          ? detail
          : Array.isArray(detail)
            ? detail.map(d => d.msg ?? String(d)).join('; ')
            : `Server returned ${resp.status}`;
        showError(msg);
        return;
      }

      renderResults(data);
      loadHistory();
    } catch (_) {
      showError('Could not reach the server. Make sure the app is running.');
    } finally {
      hide(loading);
      btnSubmit.disabled = !selectedFile;
    }
  });

  // ── Reset ─────────────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', () => {
    clearPhoto();
    inputDescription.value = '';
    hide(results);
    hide(errorBox);
  });

  // ── Render results ────────────────────────────────────────────
  const usd = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

  const CONDITION_LABELS = {
    terrible: 'Terrible', poor: 'Poor', fair: 'Fair',
    good: 'Good', like_new: 'Like New',
  };

  function renderResults(data) {
    const est = data.price_estimate;
    const pct = Math.round(est.multiplier_used * 100);
    const condLabel = CONDITION_LABELS[est.condition] ?? est.condition;

    document.getElementById('res-item').textContent = capitalize(data.item);
    document.getElementById('res-price').textContent = usd.format(est.estimated_resale_value);

    const noteEl = document.getElementById('res-price-note');
    const mockBadge = est.is_mock === true
      ? ' <span class="badge badge-estimated" title="Price is based on catalog estimates, not live eBay data">Estimated</span>'
      : '';
    noteEl.innerHTML = `${pct}% of market median · ${condLabel}${mockBadge}`;

    document.getElementById('res-median').textContent    = usd.format(est.market_median);
    document.getElementById('res-condition').textContent  = condLabel;
    document.getElementById('res-range').textContent     = `${usd.format(est.low)} – ${usd.format(est.high)}`;
    document.getElementById('res-sample').textContent    = `${est.sample_size} eBay listing${est.sample_size !== 1 ? 's' : ''}`;
    renderSearch(data);

    show(results);
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Built with textContent, never innerHTML — the search term can be the volunteer's own text
  function renderSearch(data) {
    const searchEl = document.getElementById('res-search');
    const noteEl   = document.getElementById('res-search-note');
    searchEl.textContent = data.search_term ? `“${data.search_term}”` : 'Catalog estimate';
    noteEl.textContent = searchNote(data);
  }

  const SEARCH_SOURCE_LABELS = {
    user_description: 'your description',
    vision_label: 'photo label',
  };

  // Which input set the price. Flags a description that was searched but lost out to a
  // photo label; a mock price already carries its own "estimated" badge.
  function searchNote(row) {
    const note = SEARCH_SOURCE_LABELS[row.search_source] ?? '';
    return descriptionFellBack(row) ? 'description had too few matches' : note;
  }

  function descriptionFellBack(row) {
    return Boolean(row.user_description) && row.search_source === 'vision_label';
  }

  // ── Helpers ───────────────────────────────────────────────────
  function show(el) { el.classList.add('visible'); }
  function hide(el) { el.classList.remove('visible'); }

  function showError(msg) {
    errorMsg.textContent = msg;
    show(errorBox);
  }

  function capitalize(str) {
    return str ? str.charAt(0).toUpperCase() + str.slice(1) : str;
  }

  // ── History ───────────────────────────────────────────────────
  // Stays hidden when persistence is off (/history → 503) or nothing is saved yet.
  const historyCard = document.getElementById('history');
  const historyList = document.getElementById('history-list');
  const shortDate   = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });

  async function loadHistory() {
    try {
      const resp = await fetch('/history?limit=10');
      if (!resp.ok) { hide(historyCard); return; }
      const rows = await resp.json();
      historyList.replaceChildren(...rows.map(historyRow));
      rows.length ? show(historyCard) : hide(historyCard);
    } catch (_) {
      hide(historyCard);
    }
  }

  // Built with textContent, never innerHTML — category text comes from Vision labels
  function historyRow(row) {
    const label = document.createElement('span');
    label.className = 'detail-label';
    label.textContent = capitalize(row.category);

    const meta = document.createElement('span');
    meta.className = 'history-meta';
    const cond = CONDITION_LABELS[row.condition_label] ?? row.condition_label ?? '';
    const parts = [cond, shortDate.format(new Date(row.created_at))];
    if (row.source === 'mock') parts.push('estimated');
    if (row.search_source === 'user_description') parts.push('priced from your description');
    else if (descriptionFellBack(row)) parts.push('description had too few matches');
    meta.textContent = parts.filter(Boolean).join(' · ');
    label.append(meta);

    const value = document.createElement('span');
    value.className = 'detail-value';
    value.textContent = row.estimated_price != null ? usd.format(row.estimated_price) : '—';

    const el = document.createElement('div');
    el.className = 'detail-row';
    el.append(label, value);
    return el;
  }

  loadHistory();
</script>

</body>
</html>
